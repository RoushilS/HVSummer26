buildscript {
    repositories {
        google()
        mavenCentral()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.0"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')

    implementation 'dev.nextftc.v2:control:0.2.0'
    implementation 'dev.nextftc.v2:hardware:0.2.0'
    implementation 'dev.nextftc.v2:robot:0.2.1-SNAPSHOT'

    implementation 'dev.frozenmilk.sinister:Sloth:0.3.0'
    implementation 'com.acmerobotics.slothboard:dashboard:0.3.0+0.6.0'
}